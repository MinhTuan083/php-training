version: '3.3'

volumes:
  mysql-data:

networks:
  app-network:

services:
  web-backend:
    build: ./config/backend
    ports:
      - "8080:80"
    volumes:
      - /var/www/html:/var/www/html
      - ./config/backend/php.ini:/usr/local/etc/php/conf.d/99-custom.ini

    working_dir: /var/www/html
    environment:
      APP_ENV: local
    depends_on:
      - web-mysql
      - web-redis   # Thêm redis vào đây
    restart: always
    networks:
      - app-network

  web-mysql:
    image: mysql:5.7.43
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: app_web1
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
      timeout: 5s

  web-phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: web-mysql
      MYSQL_ROOT_PASSWORD: ""
    depends_on:
      - web-mysql
    networks:
      - app-network

  web-redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - app-network
